name: Docker pipeline

on:
  push:
    branches: add-ci-docker,main
  pull_request:
    branches: add-ci-docker,main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=app

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Build & Run Docker
    runs-on: ubuntu-latest
    needs: test  # run only if test job succeeds
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t flask-ci-docker .

      - name: Run Docker container in background
        run: docker run -d -p 5000:5000 --name flask-ci-docker-container flask-ci-docker

      - name: Wait for container to be ready
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:5000 >/dev/null; then
              echo "Container is ready"
              break
            else
              echo "Waiting for container..."
              sleep 3
            fi
          done

      - name: Verify container response
        run: curl http://localhost:5000

      - name: Show container logs (optional)
        run: docker logs flask-ci-docker-container

      - name: Stop and remove container
        run: |git add .

          docker stop flask-ci-docker-container
          docker rm flask-ci-docker-container

      # Optional: Push Docker image to Docker Hub
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
      #
      # - name: Push Docker image
      #   run: docker push your-dockerhub-username/flask-ci-docker:latest
